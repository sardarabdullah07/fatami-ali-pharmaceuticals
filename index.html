    <!--
      Resolve the theme before first paint. Without this the page renders in
      light, then swaps once React mounts — on a dark-mode device that flash is
      the first thing a visitor sees. Kept in sync with `src/hooks/useTheme`.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fap-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          root.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#061E25' : '#FFFFFF')
        } catch (e) {}
      })()
    </script>
